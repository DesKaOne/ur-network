name: Provider Proxy Manager Tests

on:
  push:
    branches:
      - feature/provider-proxy-manager
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Provider and connect unit tests
        run: go test ./cmd/urnetwork ./urnetwork/connect
      - name: Verify CLI usage and proxy-check without credentials
        run: |
          go run ./cmd/urnetwork --help
          go run ./cmd/urnetwork proxy-check --max_connection=1 --concurrency=1
      - name: Legacy extender integration test (known localhost TLS/EOF failure)
        continue-on-error: true
        run: go test ./urnetwork/extender
